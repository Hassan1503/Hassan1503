name: Update Google Scholar metrics

# Refreshes assets/data/scholar.json from the public Google Scholar profile.
# Runs weekly, on demand, and whenever the fetch script or this workflow
# changes on any branch (so a PR can validate real data before merging).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_scholar.py
      - scripts/refresh_citations.py
      - scripts/sync_metrics.py
      - .github/workflows/update-scholar.yml

permissions:
  contents: write

concurrency:
  group: scholar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch metrics from Google Scholar
        run: python3 scripts/fetch_scholar.py
      # Per-paper counts first, then regenerate everything built from them —
      # otherwise the four headline metrics move each week while the individual
      # citation counts beneath them stay frozen.
      - name: Carry per-paper citation counts into the curated list
        run: python3 scripts/refresh_citations.py
      - name: Regenerate the publication list on the page and the profile
        run: |
          python3 scripts/build_publications.py
          python3 scripts/build_readme.py
      - name: Mirror the headline metrics into the page and the profile
        run: python3 scripts/sync_metrics.py
      - name: Commit updated data
        run: |
          # Covers both a new file and a modified one; empty means nothing to do
          # (unchanged data, or the fetch was refused and wrote nothing).
          if [ -z "$(git status --porcelain -- assets/data index.html README.md)" ]; then
            echo "nothing changed; the fetch was refused or the numbers are the same"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data index.html README.md
          git commit -m "Update Google Scholar metrics"
          git push
